<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--RPS--</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="gameContainer">
        <h1>-ROCK PAPER SCISSORS-</h1>
        <div id="container" class="choice">
            <div id="container">
                <div id="player" class="score"></div>
                <div id="player">Player:</div>
                <div id="player" class="choice"></div>
            </div>
            <div id="container">
                <div id="computer" class="score"></div>
                <div id="computer">Computer:</div>
                <div id="computer" class="choice"></div>
            </div>
        </div>
        <div id="container" class="result"></div>
        <div id="container">
            <h2>Choose your weapon!</h2>
            <div id="buttonsContainer">
                <button class="rock">ROCK</button>
                <button class="paper">PAPER</button>
                <button class="scissors">SCISSORS</button>
            </div>
            <div id="container" class="games">GamesPlayed</div>
        </div>
    </div>
</body>
</html>
